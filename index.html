<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Heróis</title>
  <link href="/style.css" rel="stylesheet">
</head>

<body class="bg-slate-950 text-white min-h-screen">

  <header class="bg-slate-900 border-b border-slate-800 p-6">
    <div class="max-w-6xl mx-auto">
      <h1 class="text-3xl font-bold">
        Gerenciador de Heróis
      </h1>

      <p class="text-slate-400 mt-2">
        Cadastre, visualize, edite e exclua seus super-heróis.
      </p>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6">

    <h2 class="text-2xl font-semibold mb-4">
      Painel de controle
    </h2>


<section class="bg-slate-900 border border-slate-800 rounded-xl p-6 mb-8">

  <h3 class="text-xl font-semibold mb-5">
    Cadastrar novo herói
  </h3>

  <form id="heroForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">

    <div>
      <label class="block text-sm mb-2" for="name">
        Nome do herói
      </label>
      <input
        type="text"
        id="name"
        placeholder="Ex: Homem-Aranha"
        class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white"
      >
    </div>

    <div>
      <label class="block text-sm mb-2" for="power">
        Poder
      </label>
      <input
        type="text"
        id="power"
        placeholder="Ex: Lançar teias"
        class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white"
      >
    </div>

    <div class="md:col-span-2">
      <label class="block text-sm mb-2" for="description">
        Descrição
      </label>
      <textarea
        id="description"
        rows="3"
        placeholder="Descreva o herói..."
        class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white"
      ></textarea>
    </div>

    <div class="md:col-span-2">
      <button
        type="submit"
        class="bg-purple-600 hover:bg-purple-700 rounded-lg px-6 py-3 font-semibold"
      >
        Cadastrar herói
      </button>
    </div>

  </form>

</section>


  </main>

  <script type="module" src="/script.js"></script>
</body>

</html>
