<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.H.I.E.L.D - A.R.G.U.S</title>
  <link href="/style.css" rel="stylesheet">
</head>

<body class="bg-white text-white min-h-screen">

  <header class="bg-slate-800 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-6 py-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

      <div>
        <h1 class="text-2xl font-black tracking-wider">
          S.H.I.E.L.D <span class="text-purple-500">- A.R.G.U.S</span>
        </h1>

        <p class="text-slate-400 text-sm mt-1">
          Catálogo de personagens
        </p>
      </div>

      <a
        href="/index.html"
        class="border border-slate-700 hover:border-purple-500 hover:text-purple-300 transition px-5 py-3 rounded-lg text-sm text-center"
      >
        ← Voltar ao painel
      </a>

    </div>
  </header>

  <main class="max-w-7xl mx-auto p-6">

    <section class="mb-10 mt-4">

      <p class="text-purple-400 text-xs font-bold tracking-widest uppercase">
        Banco de dados
      </p>

      <h2 class="text-3xl font-bold mt-2 text-black">
        Catálogo de heróis
      </h2>

      <p class="text-black mt-2">
        Explore e gerencie todos os personagens registrados.
      </p>

    </section>

    <section class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">

      <div class="w-full sm:max-w-md">
        <input
          type="text"
          id="searchHero"
          placeholder="Pesquisar herói..."
          class="w-full bg-slate-800 border border-slate-800 rounded-lg p-3 text-white outline-none focus:border-purple-500"
        >
      </div>

      <div class="bg-slate-800 border border-slate-800 rounded-lg px-5 py-3">
        <span class="text-slate-400 text-sm">
          Total de registros:
        </span>

        <span id="totalHeroes" class="text-purple-400 font-bold ml-2">
          --
        </span>
      </div>

    </section>

    <section>

      <div
        id="heroesList"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      </div>

    </section>

  </main>

  <script type="module" src="/herois.js"></script>

</body>
</html>
